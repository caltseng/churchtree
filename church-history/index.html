<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church History · Main Branch</title>
<link rel="stylesheet" href="../theme.css">
<script src="../theme.js"></script>
<link rel="stylesheet" href="../explorer.css">
<script defer src="https://d3js.org/d3.v7.min.js"></script>
<script defer src="../data/data.js"></script><script defer src="../graph-groups.js"></script><script defer src="../timeline-model.js"></script><script defer src="../timeline.js"></script><script defer src="../horizontal-timeline.js"></script><script defer src="../explorer.js"></script>
<link rel="icon" type="image/svg+xml" href="../assets/brand/logos/main-branch.svg"><meta name="application-name" content="Main Branch"><meta property="og:site_name" content="Main Branch"><link rel="stylesheet" href="../brand.css"><meta name="description" content="Explore church history with Main Branch: interactive maps and timelines of Christian traditions, with sourced histories."></head>
<body>
<header class="explorer-header">
  <h1><a class="main-branch-brand" href="../" aria-label="Main Branch home"><img class="main-branch-symbol" src="../assets/brand/logos/main-branch.svg" width="44" height="44" alt=""><span class="main-branch-copy">Main Branch</span></a></h1>
  <div class="explorer-actions">
    <button id="mobile-search-toggle" type="button" aria-label="Search church history" aria-expanded="false" aria-controls="search-form" title="Search church history"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    <button id="mobile-settings-toggle" type="button" aria-expanded="false" aria-controls="view-settings" aria-label="Filters" title="Filters"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6m-6 0v6"/></svg></button>
    <button id="mobile-open-details" type="button" aria-label="Details" title="Details" aria-controls="details"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></button>
  </div>
  <form id="search-form" class="header-panel" hidden><label for="search">Find a denomination or movement</label><div class="search-row"><input id="search" type="search" placeholder="Try PCA, Baptist, or Methodist" autocomplete="off"><button>Find</button><button id="mobile-close-search" type="button" aria-label="Close search" title="Close search"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="search-progress"><div id="search-status" role="status"></div><button id="search-more" type="button" aria-controls="results" hidden>Show more results</button></div><div id="results"></div></form>
  <div id="view-settings" class="header-panel" role="group" aria-label="Filters" hidden><label>Branch <select id="branch"><option value="">All branches</option></select></label><label>View <select id="layout"><option value="lineage">Compact lineage</option><option value="timeline" selected>Timeline</option></select></label><div id="orientation" class="orientation" role="group" aria-label="Timeline orientation" hidden><button type="button" id="orientation-vertical" aria-pressed="true">Vertical</button><button type="button" id="orientation-horizontal" aria-pressed="false">Horizontal</button></div><span id="period" hidden><input id="year-from" type="number" aria-label="Timeline start year"> – <input id="year-to" type="number" aria-label="Timeline end year"><button id="apply-period">Apply</button><span id="period-error" role="alert"></span></span><button id="reset">Reset</button><button id="mobile-range-toggle" aria-expanded="false" aria-controls="period" hidden>Date range</button><button id="clear-focus" hidden>Clear ancestry focus</button></div>
</header>
<main><section id="canvas"><div class="graph-status"><span id="scope-title"></span><p id="scope-note"></p><span id="count" aria-live="polite"></span><span id="level"></span></div><div class="graph-stage"><div id="graph" role="region" tabindex="0" aria-label="Interactive church history graph" aria-describedby="scope-title scope-note level"></div><div class="graph-tools"><div class="zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button></div><div id="mobile-pan" class="mobile-only" hidden><button id="time-earlier"><svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10m-4-4 4 4-4 4"/></svg>Earlier</button><button id="time-later">Later<svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10m-4-4 4 4-4 4"/></svg></button></div></div></div><div class="legend"><span><i class="legend-line"></i>Origin / continuation / merger</span><span><i class="legend-line split"></i>Split</span><span><i class="legend-line mixed"></i>Mixed grouped relationships</span></div></section><div id="splitter" role="separator" aria-label="Resize graph and details" aria-orientation="vertical" tabindex="0"></div><aside id="details" aria-label="Historical details"><h2>Church history</h2><p>Select a node or connection to read its history, or search for a denomination.</p><p>A developing dataset: coverage and source quality vary by branch.</p></aside></main>
<dialog id="mobile-details" aria-label="Historical details"><div class="mobile-dialog-header"><strong>Historical details</strong><button id="mobile-close-details" type="button">Back to graph</button></div><div id="mobile-details-body"></div></dialog></body></html>
